services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartsearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dcfv147
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartsearch_network

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smartsearch_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5233:5233"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5233
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=smartsearch;Username=postgres;Password=dcfv147
      - Jwt__Secret=change-this-to-a-secure-secret-key-at-least-32-chars
      - Jwt__Issuer=SmartSearch
      - Jwt__Audience=SmartSearchUsers
      - Qdrant__Url=http://qdrant:6333
      - Qdrant__Host=qdrant
      - Qdrant__Port=6333
      - GigaChat__ClientId=${GIGACHAT_CLIENT_ID:-}
      - GigaChat__ClientSecret=${GIGACHAT_CLIENT_SECRET:-}
      - GigaChat__Scope=${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
    volumes:
      - ./wwwroot:/app/wwwroot:ro
    networks:
      - smartsearch_network

volumes:
  postgres_data:
  qdrant_data:

networks:
  smartsearch_network:
    driver: bridge